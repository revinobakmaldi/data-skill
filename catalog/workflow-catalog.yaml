version: 1
repo: data-skill
purpose: AI skills, MCP references, and tool patterns for the analytics team
stages:
  - id: assessment
    name: Project assessment
    outputs:
      - scoped brief
      - html prototype
      - source map
    skills:
      - skills/assessment/project-brief/SKILL.md
      - skills/assessment/html-prototype/SKILL.md
      - skills/assessment/source-discovery/SKILL.md
    mcps:
      - mcp/google-mcp-toolbox.md
    tools:
      - tools/html-prototyping.md
  - id: ingestion
    name: Pipeline and ingestion
    skills:
      - skills/data-engineering/airflow-pipeline/SKILL.md
      - skills/data-engineering/source-onboarding/SKILL.md
    mcps:
      - mcp/google-mcp-toolbox.md
    tools:
      - tools/airflow.md
  - id: modeling
    name: Modeling and transformation
    skills:
      - skills/analytics-engineering/dbt-modeling/SKILL.md
      - skills/analytics-engineering/model-review/SKILL.md
    tools:
      - tools/dbt.md
  - id: quality
    name: Data quality and testing
    skills:
      - skills/quality/data-quality-tests/SKILL.md
      - skills/quality/reconciliation-checks/SKILL.md
