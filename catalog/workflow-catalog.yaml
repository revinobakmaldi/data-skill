      - tools/data-to-llm-script.md
  - id: data-science
    name: Predictive modeling and experimentation
    skills:
      - skills/data-science/experiment-design/SKILL.md
      - skills/data-science/model-review/SKILL.md
    mcps:
      - mcp/google-mcp-toolbox.md
  - id: delivery
    name: Deployment and stakeholder delivery
    skills:
      - skills/delivery/release-package/SKILL.md
      - skills/delivery/handoff-docs/SKILL.md
